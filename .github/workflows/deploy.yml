name: Deploy to GitHub Pages

# 单 main 分支最简流程:push 到 main 即自动构建 + 发布 Pages。
# 也可手动 workflow_dispatch 重跑。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Actions Pages 权限模板(官方 pages-artifact + deploy-pages 需要)
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发下多次部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js (static export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Next.js (output: export)
        env:
          # 本仓库名固定为 KnowFlow,此处写死对应的 basePath 前缀与仓库名,
          # 从而在 workflow YAML 中彻底避免出现 ${{ }} 表达式与 / 相邻的场景,
          # 防止 GitHub Actions YAML Parser 误判 Invalid workflow file。
          # 如果未来 fork 到其他仓库名下,请把下方两行中的 /KnowFlow / KnowFlow
          # 同时改成对应仓库名即可,并同步修改 next.config.ts 中的 REPO_NAME 默认值。
          NEXT_PUBLIC_BASE_PATH: "/KnowFlow"
          NEXT_PUBLIC_REPO_NAME: "KnowFlow"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js output: "export" 默认产物目录就是 ./out
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
